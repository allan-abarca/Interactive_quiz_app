<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container py-5">

    <!-- INICIO -->
    <div id="pantalla-inicio">
        <h1 class="mb-4">Trivia App</h1>
        <button id="btn-iniciar-trivia" class="btn btn-primary btn-lg me-2">Iniciar trivia</button>
        <button id="btn-editar" class="btn btn-outline-secondary btn-lg">Editar preguntas</button>
    </div>

    <!-- TRIVIA -->
    <div id="pantalla-trivia" style="display: none;">

        <!-- SUB-VISTA: PREGUNTA ACTUAL -->
      <div id="vista-pregunta">
        <h2 id="texto-pregunta"></h2>
        <div id="contenedor-opciones" class="d-grid gap-2 col-6 mx-auto my-4"></div>
        <p id="texto-feedback" class="fs-4 fw-bold"></p>
        <button id="btn-siguiente-pregunta" class="btn btn-success" style="display: none;">Siguiente pregunta</button>
        <hr class="my-4">
        <button id="btn-editar-durante-juego" type="button" class="btn btn-sm btn-outline-secondary">Editar preguntas</button>
        <button id="btn-reiniciar-durante-juego" type="button" class="btn btn-sm btn-outline-danger">Reiniciar juego</button>
      </div>

      <!-- SUB-VISTA: RESULTADOS -->
      <div id="vista-resultados" style="display: none;">
        <h2>¡Trivia finalizada!</h2>
        <p id="texto-resultado-final" class="fs-4"></p>
        <button id="btn-reiniciar" class="btn btn-primary me-2">Reiniciar juego</button>
        <button id="btn-editar-desde-resultados" class="btn btn-outline-secondary">Editar preguntas</button>
      </div>


    </div>

    <!-- EDICION -->
    <div id="pantalla-edicion" style="display: none;">
        <h1 class="mb-4">Editar preguntas</h1>

      <!-- SUB-VISTA: LISTA DE PREGUNTAS -->
      <div id="vista-lista-preguntas">

        <div id="contenedor-lista-preguntas"></div>

        <button id="btn-agregar-pregunta" type="button" class="btn btn-outline-primary mt-3">+ Agregar pregunta</button>
        <br><br>
        <button id="btn-volver-inicio" type="button" class="btn btn-secondary">Volver al inicio</button>

      </div>

      <!-- SUB-VISTA: FORMULARIO (EDITAR/AGREGAR) -->
      <div id="vista-formulario-pregunta" style="display: none;">

        <h3 id="titulo-formulario" class="mb-3"></h3>

        <form id="formulario-pregunta">
            <input type="text" id="input-pregunta" class="form-control mb-3 fw-bold" placeholder="Escribe la pregunta" required>

            <div class="input-group mb-2">
                <span class="input-group-text"><input type="radio" name="respuesta-correcta" id="radio-0" required></span>
                <input type="text" id="input-opcion-0" class="form-control" placeholder="Opción 1" required>
            </div>

            <div class="input-group mb-2">
                <span class="input-group-text"><input type="radio" name="respuesta-correcta" id="radio-1"></span>
                <input type="text" id="input-opcion-1" class="form-control" placeholder="Opción 2" required>
            </div>

            <div class="input-group mb-2">
                <span class="input-group-text"><input type="radio" name="respuesta-correcta" id="radio-2"></span>
                <input type="text" id="input-opcion-2" class="form-control" placeholder="Opción 3" required>
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text"><input type="radio" name="respuesta-correcta" id="radio-3"></span>
                <input type="text" id="input-opcion-3" class="form-control" placeholder="Opción 4" required>
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>

            <button type="button" id="btn-cancelar-formulario" class="btn btn-outline-secondary">Cancelar</button>
        </form>

      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
